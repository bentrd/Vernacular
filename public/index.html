<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <title>Vernacular</title>
  <meta name="description" content="Learn Latin, one word at a time." />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vernacular" />
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />

  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="statusbar-veil" aria-hidden="true"></div>
  <div class="scroll" id="scroll">
    <main id="view" class="view"></main>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="today" aria-label="Today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8" stroke-linecap="round"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-route="library" aria-label="Library">
      <svg viewBox="0 0 24 24"><path d="M12 5.5C10 3.9 7.3 3.5 4.5 3.8c-.6.1-1 .6-1 1.2v12.6c0 .7.6 1.2 1.3 1.2 2.5-.2 5.2.2 7.2 1.7 2-1.5 4.7-1.9 7.2-1.7.7 0 1.3-.5 1.3-1.2V5c0-.6-.4-1.1-1-1.2-2.8-.3-5.5.1-7.5 1.7Z"/><path d="M12 5.5v14.7" stroke-linecap="round"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-route="practice" aria-label="Practice">
      <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="14" rx="2.5" transform="rotate(-8 9.5 13.5)"/><rect x="8.5" y="4" width="13" height="14" rx="2.5" transform="rotate(6 15 11)"/></svg>
      <span>Practice</span>
    </button>
    <button class="tab" data-route="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.8 7.8 0 0 0-2.6-1.5L14 2.5h-4L9.6 5a7.8 7.8 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.8 7.8 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.8 7.8 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.8 7.8 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
