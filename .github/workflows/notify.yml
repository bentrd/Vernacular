# Ticks the reminder engine. Every subscriber picks their own times in the app;
# this workflow just pokes /api/cron often enough that those times can be hit.
# The endpoint works out, per subscriber and per language, which reminders came
# due since the last tick (in their own time zone) and sends only those.
#
# GitHub's scheduler drifts by a few minutes under load, and occasionally skips
# a tick entirely. /api/cron tolerates both: an occurrence stays deliverable for
# 55 minutes, and is delivered at most once.
name: Reminder tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send this type to everyone now, ignoring schedules"
        type: choice
        options: ["", word, review, assess, streak, goal]
        default: ""

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          URL="$APP_URL/api/cron"
          if [ -n "$FORCE" ]; then
            URL="$URL?force=$FORCE"
            echo "Forcing $FORCE"
          fi
          curl -fsS "$URL" -H "Authorization: Bearer $CRON_SECRET"
